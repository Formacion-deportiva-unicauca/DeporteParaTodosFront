server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Importante: nginx no hereda los add_header del server en una location que defina los suyos,
  # por eso cada location incluye las cabeceras de seguridad además de su propio Cache-Control.

  location = /index.html {
    include /etc/nginx/snippets/nginx-cabeceras.inc;
    add_header Cache-Control "no-cache";
  }

  # Archivos de Angular con hash en el nombre (main.<hash>.js, styles.<hash>.css): el contenido nunca cambia con el mismo nombre.
  location ~* \.(?:js|css)$ {
    include /etc/nginx/snippets/nginx-cabeceras.inc;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # assets/, fuentes e iconos: sin hash en el nombre, por eso 7 días y sin immutable.
  location ^~ /assets/ {
    include /etc/nginx/snippets/nginx-cabeceras.inc;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location ~* \.(?:woff2?|ttf|otf|eot|ico)$ {
    include /etc/nginx/snippets/nginx-cabeceras.inc;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/nginx-cabeceras.inc;
    try_files $uri $uri/ /index.html;
  }
}
