server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css)$ {
    expires 30d;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
