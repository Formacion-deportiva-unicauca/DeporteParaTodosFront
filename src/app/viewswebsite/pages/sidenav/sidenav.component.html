<div class="estructura">
  <header class="barra">
    <button type="button" class="btn-hamburguesa" *ngIf="isHandset$ | async"
            aria-label="Abrir menú de navegación" (click)="drawer.toggle()">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>

    <a class="marca" routerLink="/home">
      <img class="escudo" src="assets/imagesSystem/Logo-Universidad-del-Cauca-horizontal-B.png" alt="Universidad del Cauca">
      <span class="marca-texto">
        <span class="marca-titulo">Deporte para Todos</span>
        <span class="marca-sub">Vicerrectoría de Cultura y Bienestar</span>
      </span>
    </a>

    <nav class="enlaces" aria-label="Enlaces institucionales" *ngIf="(isHandset$ | async) === false">
      <a routerLink="/home">Inicio</a>
      <a routerLink="/home">Noticias</a>
      <a [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Nosotros</a>
      <a [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Contáctanos</a>
    </nav>

    <button type="button" class="usuario" [matMenuTriggerFor]="menuUsuario" aria-label="Menú de usuario">
      <span class="avatar" aria-hidden="true">{{ iniciales }}</span>
      <span class="usuario-texto">
        <span class="usuario-nombre">{{ nombreUsuario }}</span>
        <span class="usuario-rol" *ngIf="etiqueta">Rol: {{ etiqueta }}</span>
      </span>
      <mat-icon aria-hidden="true">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #menuUsuario="matMenu" xPosition="before">
      <button mat-menu-item type="button" (click)="cerrarSesion()">
        <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </header>

  <mat-sidenav-container class="contenedor">
    <mat-sidenav #drawer class="sidenav" fixedInViewport [fixedTopGap]="altoBarra"
                 [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
                 [mode]="(isHandset$ | async) ? 'over' : 'side'" [opened]="(isHandset$ | async) === false">
      <nav class="navegacion" aria-label="Navegación principal">
        <p class="titulo-panel" *ngIf="tituloPanel">{{ tituloPanel }}</p>

        <a class="nav-item" routerLink="/home" routerLinkActive="activo" ariaCurrentWhenActive="page" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">home</mat-icon>
          <span>Home</span>
        </a>
        <a class="nav-item" routerLink="/lista-instructores" routerLinkActive="activo" ariaCurrentWhenActive="page"
           *ngIf="perfil === 'Coordinador'" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">person</mat-icon>
          <span>Instructores</span>
        </a>
        <a class="nav-item" routerLink="/gestion-inscripciones" routerLinkActive="activo" ariaCurrentWhenActive="page"
           *ngIf="perfil === 'Coordinador'" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">event_available</mat-icon>
          <span>Inscripciones</span>
        </a>
        <a class="nav-item" routerLink="/reportes" routerLinkActive="activo" ariaCurrentWhenActive="page"
           *ngIf="perfil === 'Coordinador'" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">tune</mat-icon>
          <span>Reportes</span>
        </a>
        <a class="nav-item" routerLink="/info-instructor" routerLinkActive="activo" ariaCurrentWhenActive="page"
           *ngIf="perfil === 'Instructor'" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">person</mat-icon>
          <span>Mis cursos</span>
        </a>
        <a class="nav-item" routerLink="/info-estudiante" routerLinkActive="activo" ariaCurrentWhenActive="page"
           *ngIf="perfil === 'Alumno'" (click)="alNavegar(drawer)">
          <mat-icon aria-hidden="true">person</mat-icon>
          <span>Mis cursos</span>
        </a>

        <!-- En móvil los enlaces institucionales no caben en la barra: van al final del panel -->
        <div class="institucional" *ngIf="isHandset$ | async">
          <a class="enlace-institucional" [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Nosotros</a>
          <a class="enlace-institucional" [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Contáctanos</a>
        </div>
      </nav>
    </mat-sidenav>

    <mat-sidenav-content class="area-contenido">
      <div class="contenido">
        <ng-content></ng-content>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
