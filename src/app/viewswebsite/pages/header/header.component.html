<header class="barra">
  <a class="marca" routerLink="/home">
    <img class="escudo" src="assets/imagesSystem/Logo-Universidad-del-Cauca-horizontal-B.png" alt="Universidad del Cauca">
    <span class="marca-texto">
      <span class="marca-titulo">Deporte para Todos</span>
      <span class="marca-sub">Vicerrectoría de Cultura y Bienestar</span>
    </span>
  </a>

  <button type="button" class="btn-hamburguesa" aria-controls="enlaces-visitante"
          [attr.aria-expanded]="menuAbierto" aria-label="Abrir menú de navegación" (click)="alternarMenu()">
    <mat-icon aria-hidden="true">{{ menuAbierto ? 'close' : 'menu' }}</mat-icon>
  </button>

  <nav id="enlaces-visitante" class="enlaces" [class.abierto]="menuAbierto" aria-label="Enlaces institucionales">
    <a routerLink="/home">Inicio</a>
    <a routerLink="/home">Noticias</a>
    <a [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Nosotros</a>
    <a [href]="urlVicerrectoria" target="_blank" rel="noopener noreferrer">Contáctanos</a>
    <span class="rol" *ngIf="perfil">Rol: {{ etiqueta }}</span>
    <a routerLink="/login" *ngIf="!perfil">Iniciar sesión</a>
    <button type="button" class="salir" *ngIf="perfil" (click)="cerrarSesion()">Cerrar sesión</button>
  </nav>
</header>
