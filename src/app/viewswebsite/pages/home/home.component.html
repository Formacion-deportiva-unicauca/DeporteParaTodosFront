<!-- Coordinador (Home, Instructores, Reportes), Instructor y Alumno (Home, Mis cursos): menu lateral con el inicio dentro. Visitantes sin sesion: la cabecera de siempre. -->
<app-sidenav *ngIf="perfil === 'Coordinador' || perfil === 'Instructor' || perfil === 'Alumno'; else conCabecera">
    <ng-container *ngTemplateOutlet="contenidoInicio"></ng-container>
</app-sidenav>

<ng-template #conCabecera>
    <app-header></app-header>
    <ng-container *ngTemplateOutlet="contenidoInicio"></ng-container>
</ng-template>

<ng-template #contenidoInicio>
<section class="inicio">
    <h1 class="title-one titulo-pagina">Deporte para todos</h1>

    <div class="tarjeta-intro">
        <p class="descripcion">{{ descripcion }}</p>
        <span class="chip-rol" *ngIf="perfil">Rol: {{ etiquetaRol }}</span>
    </div>

    <div class="encabezado-seccion">
        <h2 class="titulo-seccion">Categorías deportivas</h2>
        <button type="button" class="btn btn-primary btnAgregar" *ngIf="perfil === 'Coordinador'" (click)="nuevaCategoria()">
            <mat-icon aria-hidden="true">add</mat-icon>
            Nueva categoría curso
        </button>
    </div>

    <div class="rejilla">
        <mat-card class="tarjeta-categoria" *ngFor="let item of listaEscenarios">
            <button type="button" class="img-container" (click)="abrirCursosDeportivos(item.titulo)"
                    [attr.aria-label]="'Ver cursos de ' + item.titulo">
                <img *ngIf="!!item.imagenBase64; else imagenPorDefecto"
                    [src]="'data:' + item.tipoArchivo + ';base64,' + item.imagenBase64" alt="" />
                <ng-template #imagenPorDefecto>
                    <img src="assets/imagesSystem/deporte.jpg" alt="" />
                </ng-template>
            </button>

            <mat-card-content class="contenido">
                <div class="cabecera-tarjeta">
                    <h3 class="card_title title-three-nrs">{{ item.titulo }}</h3>
                    <!--Menu de configuracion en tarjeta-->
                    <button class="btn-menu" mat-icon-button [matMenuTriggerFor]="menu" *ngIf="perfil === 'Coordinador'"
                            [attr.aria-label]="'Opciones de ' + item.titulo">
                        <app-icono-engranaje></app-icono-engranaje>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="onUpdate(item.titulo)">
                            <mat-icon fontSet="material-icons-outlined">edit</mat-icon>
                            <span>Actualizar</span>
                        </button>

                        <button mat-menu-item (click)="onDelete(item.titulo)">
                            <mat-icon fontSet="material-icons-outlined">delete</mat-icon>
                            <span>Eliminar</span>
                        </button>
                    </mat-menu>
                </div>
                <p class="descripcion-categoria">{{ item.descripcion }}</p>
                <button type="button" class="enlace-tarjeta" (click)="verInformacion(item)">
                    Ver información
                    <mat-icon aria-hidden="true">arrow_forward</mat-icon>
                </button>
            </mat-card-content>
        </mat-card>
    </div>
</section>
</ng-template>
