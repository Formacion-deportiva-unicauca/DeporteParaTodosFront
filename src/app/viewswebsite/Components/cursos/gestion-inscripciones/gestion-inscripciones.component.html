<button mat-icon-button type="button" class="close-button" aria-label="Cerrar diálogo" (click)="cancelar()">
  <mat-icon>close</mat-icon>
</button>

<mat-dialog-content class="dialog-content">
  <h2 mat-dialog-title class="title-two">Configurar inscripciones</h2>
  <p class="modal-description">
    Habilita o deshabilita las inscripciones a los cursos en cada una de las modalidades haciendo clic en el recuadro de
    selección.
  </p>

  <!-- Modalidades -->
  <section class="section" aria-labelledby="titulo-modalidades">
    <h3 id="titulo-modalidades" class="section-title">Modalidades</h3>
    <div class="modalidades-grid">
      <div class="modal-item" *ngFor="let modalidad of modalidades">
        <mat-checkbox [(ngModel)]="modalidad.seleccionado">{{ modalidad.nombre }}</mat-checkbox>
      </div>
    </div>
  </section>

  <!-- Rango de fechas -->
  <section class="section" aria-labelledby="titulo-fechas">
    <h3 id="titulo-fechas" class="section-title">Rango de fechas</h3>
    <mat-accordion>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            Ajustar rango de fechas para inscripciones
          </mat-panel-title>
        </mat-expansion-panel-header>
        <div class="fecha-rango">
          <mat-form-field appearance="outline">
            <mat-label>Fecha inicio</mat-label>
            <input matInput [matDatepicker]="fechaInicioPicker" [(ngModel)]="fechaInicio" />
            <mat-datepicker-toggle matSuffix [for]="fechaInicioPicker" aria-label="Abrir calendario de fecha de inicio"></mat-datepicker-toggle>
            <mat-datepicker #fechaInicioPicker></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Fecha fin</mat-label>
            <input matInput [matDatepicker]="fechaFinPicker" [(ngModel)]="fechaFin" />
            <mat-datepicker-toggle matSuffix [for]="fechaFinPicker" aria-label="Abrir calendario de fecha de fin"></mat-datepicker-toggle>
            <mat-datepicker #fechaFinPicker></mat-datepicker>
          </mat-form-field>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </section>

  <!-- Acciones: Cancelar (contorno) a la izquierda, Guardar (principal) a la derecha -->
  <div class="form-buttons">
    <button mat-button type="button" class="cancelar" (click)="cancelar()">Cancelar</button>
    <button mat-button type="button" class="aceptar" (click)="guardar()">Guardar</button>
  </div>
</mat-dialog-content>
