<div class="container">

  <div class="btn-cerrar">
    <button mat-icon-button class="close-button" matDialogClose aria-label="Cerrar diálogo">
      <mat-icon>close</mat-icon>
    </button>
  </div>


  <mat-dialog-content  >
    <div >
      <h1 mat-dialog-title class="title-one">Confirmar para eliminar el elemento</h1>
      <p *ngIf="data" class="texConfirmation"> ¿Está seguro que desea eliminar {{data.elemento}} con el identificador '{{
        data.nombreElemento}}'?</p>
      <p *ngIf="data?.advertencia" class="aviso-eliminacion" role="alert">
        <mat-icon aria-hidden="true">warning</mat-icon>
        <span>{{ data.advertencia }}</span>
      </p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close class="btn-cancelar">Cancelar</button>
    <button mat-button (click)="confirmarEliminar()" class="btn-confirmar">Aceptar</button>
  </mat-dialog-actions>
</div>
