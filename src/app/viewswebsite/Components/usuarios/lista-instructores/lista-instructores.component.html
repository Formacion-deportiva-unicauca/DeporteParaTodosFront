<app-sidenav>
  <div class="containerButons">
    <div class="row">
      <div class="col-lg-4 d-flex justify-content-center">
        <div class="col-lg-7">
          <select class="form-select" aria-label="Default select example">
            <option selected>Selecciona</option>
            <option value="1">Seleccionados</option>
            <option value="2">Semilleros</option>
            <option value="3">Recreativo</option>
          </select>
        </div>
      </div>
      <div class="col-lg-4 d-flex justify-content-center">
        <button class="btnAgregar" *ngIf="perfil === 'Coordinador'" (click)="registroInstructor()">
          Agregar instructor +
        </button>
      </div>
    </div>
  </div>

  <div class="listado">
    <h2>Listado de instructores</h2>

    <div class="buscador">
      <label for="buscar-instructor">Buscar instructor</label>
      <input id="buscar-instructor" type="search" autocomplete="off"
             aria-describedby="ayuda-buscar-instructor"
             [ngModel]="filtro" (ngModelChange)="onFiltroChange($event)">
      <small id="ayuda-buscar-instructor">Por identificación, nombre o correo</small>
    </div>

    <p class="estado-lista" aria-live="polite">{{ textoEstado }}</p>
    <button *ngIf="sinCoincidencias" type="button" class="btn-limpiar-busqueda" (click)="limpiarBusqueda()">
      Limpiar búsqueda
    </button>

    <div class="tabla-container">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort
             [style.display]="hayFilas ? null : 'none'">
        <!-- Columna Código -->
        <ng-container matColumnDef="Identificacion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Identificación</th>
          <td mat-cell *matCellDef="let instructor">{{ instructor.id }}</td>
        </ng-container>

        <!-- Columna Nombre -->
        <ng-container matColumnDef="Nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let instructor">
            <a class="enlace-instructor" [routerLink]="['/lista-instructores', instructor.id]">{{ instructor.nombre }}</a>
          </td>
        </ng-container>

        <!-- Columna Correo -->
        <ng-container matColumnDef="Correo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
          <td mat-cell *matCellDef="let instructor">{{ instructor.correo }}</td>
        </ng-container>

        <ng-container matColumnDef="Acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let instructor">
            <button mat-icon-button type="button" color="primary" *ngIf="perfil === 'Coordinador'"
                    [attr.aria-label]="'Editar instructor ' + instructor.nombre"
                    (click)="editarInstructor(instructor)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" *ngIf="perfil === 'Coordinador'" (click)="onDelete(instructor)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Header y celdas -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</app-sidenav>
