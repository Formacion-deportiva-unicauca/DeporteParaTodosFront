<app-sidenav>
  <div class="container">

    <div *ngIf="perfil && perfil !== 'Instructor'" class="msg-rol">
      <p>Esta sección es exclusiva para el rol Instructor.</p>
    </div>

    <ng-container *ngIf="perfil === 'Instructor'">

      <div class="personal-info">
        <div class="info-text">
          <h3>Tu información</h3>

          <div *ngIf="cargandoPerfil" class="cargando-wrapper" aria-live="polite">
            <mat-spinner diameter="32"></mat-spinner>
            <span>Cargando tus datos...</span>
          </div>

          <table *ngIf="!cargandoPerfil">
            <tr>
              <th scope="row">Nombre:</th>
              <td>{{ nombreInstructor ?? 'No disponible' }}</td>
            </tr>
            <tr>
              <th scope="row">Código:</th>
              <td>{{ codigoInstructor ?? 'No disponible' }}</td>
            </tr>
            <tr>
              <th scope="row">Rol:</th>
              <td>{{ perfil }}</td>
            </tr>
          </table>
        </div>
        <div class="profile-pic">
          <img src="./assets/imagesSystem/Silueta.jpeg" alt="Foto de perfil" />
        </div>
      </div>

      <div class="course-info">
        <h3>Mis cursos a cargo</h3>

        <app-tabla-grupos-instructor
          [grupos]="grupos"
          [cargando]="cargando"
          (verDeportistas)="verDeportistas($event)">
        </app-tabla-grupos-instructor>
      </div>

    </ng-container>

  </div>
</app-sidenav>
